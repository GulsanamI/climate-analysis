name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Qo'lda ham ishga tushirish mumkin

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter matplotlib pandas numpy pyinstaller

      - name: 🔨 EXE fayl yaratish
        run: |
          pyinstaller --onefile --windowed `
            --name "IqlimTahlili" `
            --hidden-import=customtkinter `
            --hidden-import=matplotlib `
            --hidden-import=matplotlib.backends.backend_tkagg `
            --hidden-import=pandas `
            --hidden-import=numpy `
            --collect-all customtkinter `
            --collect-all matplotlib `
            climate_analysis.py

      - name: 📤 EXE ni artifact sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: IqlimTahlili-Windows-EXE
          path: dist/IqlimTahlili.exe
          retention-days: 30
